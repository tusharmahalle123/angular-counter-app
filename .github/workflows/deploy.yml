name: Angular Docker → K8s Deploy

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:  # manual trigger

jobs:
  build-and-deploy:
    runs-on: self-hosted

    env:
      NODE_OPTIONS: --openssl-legacy-provider
      IMAGE_NAME: counter-app:latest
      K8S_NAMESPACE: dev
      DEPLOYMENT_NAME: angular-counter-app
      SERVICE_NAME: angular-counter-service

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3️⃣ Install npm dependencies
      - name: Install NPM dependencies
        shell: pwsh
        run: npm ci

      # 4️⃣ Build Angular app
      - name: Build Angular
        shell: pwsh
        run: npm run build

      # 5️⃣ Build Docker image locally
      - name: Build Docker Image
        shell: pwsh
        run: docker build -t $env:IMAGE_NAME .

      # 6️⃣ Apply Kubernetes manifests
      - name: Deploy to Kubernetes
        shell: pwsh
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      # 7️⃣ Restart deployment to pick up new image
      - name: Restart Deployment
        shell: pwsh
        run: kubectl rollout restart deployment $env:DEPLOYMENT_NAME -n $env:K8S_NAMESPACE
